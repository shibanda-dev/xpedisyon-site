backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "fr"

collections:
  - name: "contenu"
    label: "Contenu du site XPEDISYON"
    files:
      - name: "config"
        label: "Textes, piliers, destinations, témoignages, contact"
        file: "config.json"
        fields:
          - label: "Section Hero (haut de page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petit texte au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre — ligne 1", name: "titre_ligne1", widget: "string" }
              - { label: "Titre — ligne 2 (en orange)", name: "titre_ligne2", widget: "string" }
              - { label: "Texte principal", name: "texte", widget: "text" }
              - { label: "Slogan (pilule)", name: "slogan_pill", widget: "string" }

          - label: "Statistiques (4 chiffres clés)"
            name: "stats"
            widget: "list"
            max: 4
            min: 4
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Libellé", name: "libelle", widget: "string" }

          - label: "Piliers de différenciation (6)"
            name: "piliers"
            widget: "list"
            fields:
              - { label: "Icône (emoji)", name: "icone", widget: "string" }
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Destinations (3)"
            name: "destinations"
            widget: "list"
            fields:
              - { label: "Étiquette (tag)", name: "tag", widget: "string" }
              - { label: "Nom de la destination", name: "nom", widget: "string" }
              - { label: "Sous-titre", name: "sous_titre", widget: "string" }
              - { label: "Image (URL ou upload)", name: "image", widget: "image" }

          - label: "Étapes du processus (5)"
            name: "etapes"
            widget: "list"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Témoignages"
            name: "temoignages"
            widget: "list"
            fields:
              - { label: "Initiales (avatar)", name: "initiales", widget: "string" }
              - { label: "Texte du témoignage", name: "texte", widget: "text" }
              - { label: "Nom du client", name: "nom", widget: "string" }
              - { label: "Contexte (ex: Famille 5 personnes · RD 2025)", name: "contexte", widget: "string" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "WhatsApp (indicatif + numéro, ex. 15141234567 — utilisé pour les liens)", name: "whatsapp", widget: "string" }
              - { label: "WhatsApp affiché (ex. 514-XXX-XXXX)", name: "whatsapp_affiche", widget: "string" }
              - { label: "Courriel", name: "email", widget: "string" }
              - { label: "Ville", name: "ville", widget: "string" }
              - { label: "Disponibilité", name: "disponibilite", widget: "string" }
